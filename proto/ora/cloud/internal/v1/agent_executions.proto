syntax = "proto3";

package ora.cloud.internal.v1;

import "google/protobuf/timestamp.proto";

// Execution kinds of an Agent IssueRun: one Agent session in the run Workspace, then one or more
// Revision deliveries. Both are claimed through ExecutionService.ClaimWork with the IssueRun ID as
// operation ID; their target Node is decided by Cloud. A Node resolves the checkout from its own
// ledger through the clone execution ID, so no Node-local path crosses this contract.

// Commit identity the Node exports to the Agent's process tree as GIT_AUTHOR_* and GIT_COMMITTER_*;
// snapshotted when the run was created. It is never written to a Git configuration.
message GitIdentity {
  string name = 1;
  string email = 2;
}

message TextContent {
  string text = 1;
}

// One block of user content handed to the Agent; only text in the first version.
message ContentBlock {
  oneof block {
    TextContent text = 1;
  }
}

// One user turn of a Thread. `turn_id` is generated by Cloud and carried into the Node's user
// message record so Cloud can mark the turn delivered.
message UserTurn {
  string turn_id = 1;
  repeated ContentBlock content = 2;
}

// The Revision a new run of the same Issue resumes from (IssueRun resume decision D1). On a session
// spec it also says where the Node fetches the prior final commit and what it was based on; on a
// delivery spec it carries only the identity and final commit.
message PriorRevision {
  reserved 3;
  reserved "bundle";
  string revision_id = 1;
  string final_commit = 2;
  // Session spec only: the Git Server repository and verified delivery ref holding final_commit.
  string git_repository_url = 4;
  string delivery_ref = 5;
  // Session spec only: the base commit of the prior Revision, used to tell whether the Workspace
  // snapshot still contains it.
  string base_commit = 6;
}

// One Workspace of the session's Project, so `ora-git list` can name branches by Issue and run. It
// is a snapshot taken when the work item was released and never takes part in authorization.
message WorkspaceListing {
  string workspace_id = 1;
  // main | isolated | run
  string kind = 2;
  // Run Workspaces only.
  string issue_id = 3;
  string issue_title = 4;
  string issue_run_id = 5;
  // As of when the session work item was released.
  string run_status = 6;
}

message AgentSessionSpec {
  // Canonical Plugin ID and exact version of the agent plugin installed in the Workspace.
  string agent_plugin_id = 1;
  string agent_plugin_version = 2;
  // A successful clone execution of the run Workspace on the same Node.
  string checkout_execution_id = 3;
  GitIdentity git_identity = 4;
  // The prompt Cloud rendered from the Issue; later turns arrive as Thread commands.
  UserTurn initial_turn = 5;
  // Set when the run resumes an earlier Revision of its Issue. The Node restores it into the checkout
  // before starting the agent and needs a Node capable of restore; if restore fails the session ends
  // AGENT_FAILED with detail `prior_revision_unavailable` or `prior_revision_base_unavailable`.
  PriorRevision prior_revision = 6;
  // Opaque personal-model snapshot reference. Empty for agents that do not use model-gateway.
  // No provider credential or temporary access token crosses this contract.
  string model_binding_id = 7;
  // Workspaces of this Project, newest first, at most 100, fixed when the work item was released.
  repeated WorkspaceListing workspace_directory = 8;
}

enum AgentSessionEndReason {
  AGENT_SESSION_END_REASON_UNSPECIFIED = 0;
  AGENT_SESSION_END_REASON_USER_ENDED = 1;
  AGENT_SESSION_END_REASON_IDLE_TIMEOUT = 2;
  AGENT_SESSION_END_REASON_CANCELLED = 3;
  // The agent plugin was unavailable or its runtime gave up; `detail` names the cause.
  AGENT_SESSION_END_REASON_AGENT_FAILED = 4;
  // The Node restarted; the session record was sealed and the Workspace kept.
  AGENT_SESSION_END_REASON_INTERRUPTED = 5;
}

// The only terminal result of a session execution. It is taken over only after every Thread event
// before it, so the Thread's last entry lands before the session is known to have ended.
message AgentSessionEnded {
  AgentSessionEndReason reason = 1;
  // Bounded code such as `agent_plugin_unavailable`; never raw Agent output.
  optional string detail = 2;
}

message DeliverRevisionSpec {
  reserved 5;
  reserved "bundle_key";
  // The ended session whose Workspace and history are saved.
  string session_execution_id = 1;
  string checkout_execution_id = 2;
  // Commit of the run Workspace's clone.
  string base_commit = 3;
  // Must be under `refs/ora/revisions/`.
  string revision_ref = 4;
  // Object key Cloud chose for the session history; upload grants are issued only for this key.
  string history_key = 6;
  // The session's resumed Revision, identity and final commit only. A final commit equal to its
  // final commit is reported as RevisionUnchanged.
  PriorRevision prior_revision = 7;
  // Fixed by Cloud when the work item was released; the Node pushes the final commit to
  // delivery_ref (create only) in this repository.
  string git_repository_url = 8;
  // Under `refs/ora/deliveries/`.
  string delivery_ref = 9;
  // The run Workspace's branch, from its clone input. The Node fast-forwards it to the final commit
  // after the delivery ref is pushed; failing to do so never fails the delivery.
  string workspace_ref = 10;
}

// An object the Node uploaded, as the Node measured it; Cloud verifies it before registering.
message StoredObject {
  string key = 1;
  uint64 size = 2;
  // Lowercase hexadecimal SHA-256.
  string sha256 = 3;
}

// The final commit was pushed to the input's delivery_ref; Cloud verifies the ref before registering.
message RevisionDelivered {
  reserved 4;
  reserved "bundle";
  string final_commit = 1;
  string base_commit = 2;
  string revision_ref = 3;
  StoredObject history = 5;
}

// The final commit equals the base commit, or the delivery spec's prior_revision final commit (a
// resumed run that added nothing). It still pushes its own delivery_ref and attempts to fast-forward
// workspace_ref before uploading only the session history.
message RevisionUnchanged {
  string final_commit = 1;
  string base_commit = 2;
  string revision_ref = 3;
  StoredObject history = 4;
}

enum RevisionFailureReason {
  REVISION_FAILURE_REASON_UNSPECIFIED = 0;
  REVISION_FAILURE_REASON_SESSION_NOT_SETTLED = 1;
  REVISION_FAILURE_REASON_CHECKOUT_UNAVAILABLE = 2;
  REVISION_FAILURE_REASON_SNAPSHOT_FAILED = 3;
  // Kept for history only; a new result carrying it is rejected.
  REVISION_FAILURE_REASON_BUNDLE_FAILED = 4;
  REVISION_FAILURE_REASON_HISTORY_UNAVAILABLE = 5;
  REVISION_FAILURE_REASON_UPLOAD_FAILED = 6;
  // Recorded by Cloud when the declared objects are missing or differ; a Node never reports it.
  REVISION_FAILURE_REASON_VERIFICATION_FAILED = 7;
  // The Git Server refused the delivery ref push (401, 403 or a declined ref update).
  REVISION_FAILURE_REASON_PUSH_REJECTED = 8;
  // The delivery ref push failed on 5xx, network, TLS or deadline after the retries ran out.
  REVISION_FAILURE_REASON_PUSH_FAILED = 9;
}

message RevisionFailed {
  RevisionFailureReason reason = 1;
}

// A presigned single-object upload. It is a short-lived bearer credential: Cloud, the Controller
// and the Node keep it in memory only and never log it.
message UploadGrant {
  string object_key = 1;
  string url = 2;
  // Always PUT in the first version.
  string method = 3;
  // Headers the upload must carry unchanged, including signed `If-None-Match: *` (create only).
  // A checksum-bound grant includes `x-amz-checksum-sha256`; legacy uploaders add that digest.
  // On 412, preserve the existing object and submit the declaration for Cloud verification;
  // neither the uploader nor Controller may treat 412 alone as proof that its bytes match.
  map<string, string> headers = 4;
  google.protobuf.Timestamp expires_at = 5;
}

