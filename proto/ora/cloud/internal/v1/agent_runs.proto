syntax = "proto3";

package ora.cloud.internal.v1;

import "ora/cloud/internal/v1/agent_executions.proto";
import "ora/cloud/internal/v1/executions.proto";

// What an Agent IssueRun needs beyond ExecutionService: the session execution's non-terminal
// Thread events, Thread commands (user turns and end requests) Cloud persisted for the Node, and
// upload grants for a delivery execution. Writes carry `submission_id` with the same replay rules as
// ExecutionService and are fenced by the caller's lease `epoch`.
service AgentRunService {
  // Takes over a contiguous batch of Thread events of one session execution in one transaction.
  // Only after this succeeds may the Controller acknowledge those sequences to the Node.
  rpc TakeOverThreadEvents(TakeOverThreadEventsRequest) returns (TakeOverThreadEventsResponse);
  // Lists Thread commands not yet recorded as delivered. Read-only; it claims nothing.
  rpc ClaimThreadCommands(ClaimThreadCommandsRequest) returns (ClaimThreadCommandsResponse);
  // Records that the Node durably accepted (or refused as ended) a command; it is not listed again.
  rpc RecordThreadCommandDelivered(RecordThreadCommandDeliveredRequest) returns (RecordThreadCommandDeliveredResponse);
  // Issues fresh upload grants for a registered delivery execution that has no result yet. Not a
  // write: nothing is recorded, and every call issues new grants.
  rpc GrantRevisionUpload(GrantRevisionUploadRequest) returns (GrantRevisionUploadResponse);
  // Issues a fresh read grant for the prior Revision bundle of a registered session execution that
  // has no result yet. Not a write: nothing is recorded, and every call issues a new grant.
  rpc GrantRevisionDownload(GrantRevisionDownloadRequest) returns (GrantRevisionDownloadResponse);
}

// One non-terminal event of a session execution, as the Node sent it. Thread events share the
// execution's sequence space with its terminal event.
message ThreadEvent {
  uint64 sequence = 1;
  // Set when the record belongs to a user turn.
  optional string turn_id = 2;
  // One settled `ora-history` record as a JSON object, at most 256 KiB. Cloud stores it verbatim
  // and never rewrites it; an identical sequence with a different record conflicts.
  string record = 3;
  // The Node replaced an oversized record with a shortened one; the session history keeps the
  // original.
  bool truncated = 4;
}

message TakeOverThreadEventsRequest {
  string submission_id = 1;
  int64 epoch = 2;
  // The IssueRun ID.
  string operation_id = 3;
  string execution_id = 4;
  // 1 to 64 events in ascending, gap-free sequence order. The first must be the highest sequence
  // already taken over plus one, or an already taken-over sequence with identical content (a
  // replay, skipped). A gap or different content fails with ABORTED (CONFLICT) and writes nothing.
  repeated ThreadEvent events = 5;
}

message TakeOverThreadEventsResponse {
  // Highest sequence of this execution Cloud has taken over, replays included.
  uint64 taken_over_through = 1;
}

enum EndSessionReason {
  END_SESSION_REASON_UNSPECIFIED = 0;
  END_SESSION_REASON_USER_ENDED = 1;
  END_SESSION_REASON_IDLE_TIMEOUT = 2;
  END_SESSION_REASON_CANCELLED = 3;
}

// Queues a user turn behind the one in progress; it never interrupts the current turn.
message SubmitUserTurn {
  UserTurn turn = 1;
}

// Asks the Node to cancel the current turn, discard queued turns and end the session.
message EndSession {
  EndSessionReason reason = 1;
}

message ThreadCommand {
  // Generated by Cloud; the Node executes one command ID at most once.
  string command_id = 1;
  string run_id = 2;
  // The run's session execution, already registered through RecordDispatch.
  string execution_id = 3;
  WorkTarget target = 4;
  oneof command {
    SubmitUserTurn submit_user_turn = 5;
    EndSession end_session = 6;
  }
}

message ClaimThreadCommandsRequest {
  int64 epoch = 1;
  // 1 to 100.
  uint32 limit = 2;
}

message ClaimThreadCommandsResponse {
  // Grouped by run and ordered by creation within a run. Commands of a run whose session execution
  // is not registered yet stay in Cloud and are not listed.
  repeated ThreadCommand commands = 1;
}

message RecordThreadCommandDeliveredRequest {
  string submission_id = 1;
  int64 epoch = 2;
  string command_id = 3;
  string execution_id = 4;
}

message RecordThreadCommandDeliveredResponse {}

message GrantRevisionUploadRequest {
  int64 epoch = 1;
  // A delivery execution registered through RecordDispatch.
  string execution_id = 2;
  // Optional object key -> lowercase hexadecimal SHA-256. Keys must belong to the frozen
  // delivery input. Cloud binds each checksum into its ephemeral PUT signature; refreshing
  // this capability never changes the execution input. Omit for legacy v1 grants.
  map<string, string> checksums = 3;
}

message GrantRevisionUploadResponse {
  // One grant per requested checksum key, or both input keys for legacy requests.
  repeated UploadGrant grants = 1;
}

message GrantRevisionDownloadRequest {
  int64 epoch = 1;
  // A session execution registered through RecordDispatch whose input carries prior_revision.
  string execution_id = 2;
}

message GrantRevisionDownloadResponse {
  // Exactly one grant, for the input's prior_revision bundle key.
  repeated DownloadGrant grants = 1;
}
