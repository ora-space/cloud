# nginx template for the `web` image target: serves the built frontend and proxies the Gateway's
# paths so browser, cookies and the Gateway's Origin check all see one origin. The official image
# substitutes ${GATEWAY_UPSTREAM} at startup.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ~ ^/(auth|api|healthz)(/|$) {
        proxy_pass ${GATEWAY_UPSTREAM};
        # The Gateway derives nothing from these headers (its origin is public.base_url), but it
        # compares the browser's Origin with that origin, so the original Host must pass through.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Client-side routes fall back to the SPA entry point.
    location / {
        try_files $uri /index.html;
    }
}
