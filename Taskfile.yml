version: '3'
tasks:
  default:
    cmds: [task --list]
  format:
    aliases: [fmt]
    cmds:
      - go tool gofumpt -w -extra .
      - go tool goimports -w -local github.com/wanglongan587/cloud .
  format:check:
    cmds: [go run ./cmd/checkformat]
  lint:
    cmds: [go tool golangci-lint run -c .golangci.yml]
  lint:fix:
    cmds: [go tool golangci-lint run -c .golangci.yml --fix]
  test:
    desc: All tests; real PostgreSQL is mandatory
    env:
      REQUIRE_POSTGRES: '1'
    cmds: [go test -count=1 -v -coverpkg=./internal/... -coverprofile=coverage.out ./...]
  test:integration:
    desc: Real HTTP + PostgreSQL + disk + Git acceptance tests
    env:
      REQUIRE_POSTGRES: '1'
    cmds: [go test -count=1 -v ./integration]
  test:unit:
    cmds: [go test ./internal/... ./cmd/...]
  test:race:
    desc: Full suite with race detector; Windows requires a C compiler
    env:
      REQUIRE_POSTGRES: '1'
      CGO_ENABLED: '1'
    cmds: [go test -race -count=1 -v ./...]
  check:
    cmds:
      - task: format:check
      - task: lint
      - task: test
  build:
    cmds:
      - go build -o bin/ ./cmd/server ./cmd/cloudctl ./cmd/simulator
  run:
    cmds: [go run ./cmd/server]
  migrate:
    cmds: [go run ./cmd/cloudctl -command migrate]
  simulate:
    desc: Demonstrate real HTTP/PG/Git lifecycle with simulated execution components
    cmds: [go run ./cmd/simulator]
  openapi:
    cmds: [go run ./cmd/openapi]
