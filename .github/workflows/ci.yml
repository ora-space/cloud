name: Cloud checks
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d ora_test'
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: 'host=127.0.0.1 port=5432 user=postgres password=postgres dbname=ora_test sslmode=disable'
      REQUIRE_POSTGRES: '1'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go run ./cmd/checkformat
      - run: go tool golangci-lint run -c .golangci.yml
      - run: go test -race -count=1 -v -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - run: go build ./cmd/server ./cmd/cloudctl ./cmd/simulator
