server:
  port: 8080
  mode: "debug" # debug | release | test
  read_timeout: 10s
  write_timeout: 10s

logger:
  level: "info" # debug | info | warn | error
  filename: "logs/app.log"
  max_size: 100 # MB
  max_backups: 10
  max_age: 30 # days
  compress: true
  enable_console: true

database:
  driver: "postgres"
  # Locally overridden by CLOUD_DATABASE_DSN from .local/dev.env (`task setup`).
  dsn: "host=127.0.0.1 port=55432 user=postgres dbname=ora_test sslmode=disable"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
collaboration:
  # Development-only: installs the in-memory Agent/Team/Workflow fixtures (internal/collab) onto the
  # Store's collaboration ports, so the @ target discovery API serves agent/team/workflow targets in
  # addition to humans. Explicitly enabled; production default OFF. Independent of authentication —
  # enabling GitHub Auth never enables these fixtures. Override: CLOUD_COLLABORATION_DEVELOPMENT_FIXTURES=true.
  development_fixtures: false

# Corporate deployments configure the fixed Tianzhou endpoint and machine
# credentials. Public deployments leave directory.endpoint empty.
# directory:
#   endpoint: "https://tianzhou.huawei.com/api/framework/v1/user/search"
#   hw_id: "<deployment value>"
#   environment: "<deployment value>"
#   app_key_file: "/run/ora-secrets/tianzhou-app-key"
control:
  grpc_addr: "127.0.0.1:8082" # Controller-facing gRPC, unauthenticated at this stage; loopback or private network only
auth:
  audience: "ora-cloud"
  # Public keys of the local Gateway; generate them with `task setup` (config.toml). Production replaces
  # these entries with the deployment's keys; see docs/authentication.md.
  keys:
    - id: gateway-service-2026
      issuer: ora-internal-issuer
      kind: service
      role: gateway
      public_key_file: .local/gateway/gateway-service.pem
    - id: user-identity-2026
      issuer: ora-internal-issuer
      kind: user
      public_key_file: .local/gateway/user-identity.pem
issue_runs:
  # Thread D4's idle window: how long a Thread may sit `idle` (its last taken-over record was
  # `TurnEnded` and no user turn is still queued) before Cloud releases `EndSession{idle_timeout}`
  # and moves it to `ending`. A deployment duration, not a per-run column, and judged on database
  # time. The approved first-version default is 15m; omitting the key (or setting it non-positive)
  # selects that default. Override: CLOUD_ISSUE_RUNS_THREAD_IDLE_TIMEOUT.
  thread_idle_timeout: 15m
  # Windows freeze per run; confirmation expiry retains unknown resources in a residual ledger.
  agent_start_timeout: 2m
  agent_restore_timeout: 6m
  agent_end_confirm_timeout: 5m
  # IssueRun D5's two give-up limits for a Revision delivery, both deployment durations judged on
  # database time and both not per-run columns. `delivery_give_up_after` is the continuous-failure
  # window: once a run has been failing to deliver for longer than this, Cloud abandons the delivery
  # (`deliveryState = failed`) and releases the run's Workspace. `delivery_unreachable_after` is the
  # unreachability window: once the run Workspace's Node has been in an unknown state this long, the
  # delivery cannot succeed and Cloud gives up without waiting out the full failure window. The
  # approved first-version defaults are 2h and 30m; omitting a key (or setting it non-positive)
  # selects its default. Overrides: CLOUD_ISSUE_RUNS_DELIVERY_GIVE_UP_AFTER /
  # CLOUD_ISSUE_RUNS_DELIVERY_UNREACHABLE_AFTER.
  delivery_give_up_after: 2h
  delivery_unreachable_after: 30m

plugins:
  # Plugin marketplace the cloud server syncs into its own catalog snapshot (git fetch + scan of
  # registry/**/orax.toml). The catalog API always reads the PostgreSQL snapshot and never the
  # network; the first sync runs at startup, then every sync_interval. Override:
  # CLOUD_PLUGINS_MARKETPLACE_URL / _BRANCH / _SYNC_INTERVAL / _SYNC_ENABLED.
  marketplace_url: "https://github.com/ora-space/marketplace"
  marketplace_branch: "main"
  sync_interval: 5m
  sync_enabled: true
  # Workflow asset import downloads the selected kind='workflow' package from the catalog locator
  # and imports its assets/workflows/*.json documents as tenant workflows. It runs independently
  # of Node installation, so spaces without a live runtime still receive their templates.
  # Override: CLOUD_PLUGINS_ASSET_IMPORT_ENABLED / _ASSET_IMPORT_INTERVAL.
  asset_import_enabled: true
  asset_import_interval: 30s

object_store:
  # Cloud's own S3-compatible object storage for Revision objects (Cloud Revision D1): optional
  # S3-compatible upload-grant service. Credentials are mounted files, never values here.
  # CLOUD_OBJECT_STORE_* overrides each key; this does not enable Revision verification (M3).
  #
  # `enabled: false` (or leaving the section out) runs the server without object storage: every
  # Revision upload grant is refused as UNAVAILABLE and each delivery fails until IssueRun D5's
  # give-up window releases the run — the server logs the missing capability at startup.
  #
  # Credentials are references, never values: `access_key_id_file` and `secret_access_key_file` name
  # files that are read at startup and then live only in the Cloud process. Never put a key or secret
  # in this file, an environment variable or a log. `public_endpoint` is only for deployments whose
  # Nodes reach the store at a different address than Cloud does; `path_style` is what MinIO needs.
  # Overrides: CLOUD_OBJECT_STORE_ENDPOINT / _PUBLIC_ENDPOINT / _REGION / _BUCKET / _PATH_STYLE /
  # _ACCESS_KEY_ID_FILE / _SECRET_ACCESS_KEY_FILE / _UPLOAD_GRANT_TTL.
  enabled: false
  endpoint: ""
  public_endpoint: ""
  region: "us-east-1"
  bucket: "revisions"
  path_style: true
  access_key_id_file: ""
  secret_access_key_file: ""
  upload_grant_ttl: 15m

git_server:
  # The Git Server holding every Project repository (Revision D2). Workspaces clone Binding
  # snapshots from it and Revisions are delivered to it; Cloud writes `repository_base_url` into
  # clone, session and delivery inputs and verifies refs through the ref query listener with its own
  # client certificate. Leaving `repository_base_url` empty runs without a Git Server: clone steps
  # block as git_server_unconfigured and deliveries are skipped. The key is a file reference, never a
  # value here.
  # Overrides: CLOUD_GIT_SERVER_REPOSITORY_BASE_URL / _REF_QUERY_URL / _CA_FILE / _CLIENT_CERT_FILE /
  # _CLIENT_KEY_FILE / _REF_QUERY_TIMEOUT.
  repository_base_url: ""
  ref_query_url: ""
  ca_file: ""
  client_cert_file: ""
  client_key_file: ""
  ref_query_timeout: 10s
