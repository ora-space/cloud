server:
  port: 8080
  mode: "debug" # debug | release | test
  read_timeout: 10s
  write_timeout: 10s

logger:
  level: "info" # debug | info | warn | error
  filename: "logs/app.log"
  max_size: 100 # MB
  max_backups: 10
  max_age: 30 # days
  compress: true
  enable_console: true

database:
  driver: "postgres"
  dsn: "host=127.0.0.1 port=55432 user=postgres dbname=ora_test sslmode=disable"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
auth:
  audience: "ora-cloud"
  keys: [] # Required at server startup; see docs/authentication.md.
