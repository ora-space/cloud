server:
  port: 8080
  mode: "debug" # debug | release | test
  read_timeout: 10s
  write_timeout: 10s

logger:
  level: "info" # debug | info | warn | error
  filename: "logs/app.log"
  max_size: 100 # MB
  max_backups: 10
  max_age: 30 # days
  compress: true
  enable_console: true

database:
  driver: "postgres"
  # Locally overridden by CLOUD_DATABASE_DSN from .local/dev.env (`task setup`).
  dsn: "host=127.0.0.1 port=55432 user=postgres dbname=ora_test sslmode=disable"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
collaboration:
  # Development-only: installs the in-memory Agent/Team/Workflow fixtures (internal/collab) onto the
  # Store's collaboration ports, so the @ target discovery API serves agent/team/workflow targets in
  # addition to humans. Explicitly enabled; production default OFF. Independent of authentication —
  # enabling GitHub Auth never enables these fixtures. Override: CLOUD_COLLABORATION_DEVELOPMENT_FIXTURES=true.
  development_fixtures: false
control:
  grpc_addr: "127.0.0.1:8082" # Controller-facing gRPC, unauthenticated at this stage; loopback or private network only
auth:
  audience: "ora-cloud"
  # Public keys of the local Gateway; generate them with `task setup` (config.toml). Production replaces
  # these entries with the deployment's keys; see docs/authentication.md.
  keys:
    - id: gateway-service-2026
      issuer: ora-internal-issuer
      kind: service
      role: gateway
      public_key_file: .local/gateway/gateway-service.pem
    - id: user-identity-2026
      issuer: ora-internal-issuer
      kind: user
      public_key_file: .local/gateway/user-identity.pem
plugins:
  # Plugin marketplace the cloud server syncs into its own catalog snapshot (git fetch + scan of
  # registry/**/orax.toml). The catalog API always reads the PostgreSQL snapshot and never the
  # network; the first sync runs at startup, then every sync_interval. Override:
  # CLOUD_PLUGINS_MARKETPLACE_URL / _BRANCH / _SYNC_INTERVAL / _SYNC_ENABLED.
  marketplace_url: "https://github.com/ora-space/marketplace"
  marketplace_branch: "main"
  sync_interval: 5m
  sync_enabled: true
