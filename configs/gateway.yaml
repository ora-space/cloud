# Gateway configuration. Every secret is a file reference; values are never inline.
# Environment overrides use the GATEWAY_ prefix, e.g. GATEWAY_SESSION_TTL=720h.
server:
  port: 8081
  mode: "debug" # debug | release | test
  read_timeout: 10s
  write_timeout: 30s

logger:
  level: "info"
  filename: "logs/gateway.log"
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true
  enable_console: true

database:
  driver: "postgres"
  # Locally overridden by GATEWAY_DATABASE_DSN from .local/dev.env (`task setup`).
  # Use a dedicated runtime role limited to gateway_login_attempts and gateway_sessions in production.
  dsn: "host=127.0.0.1 port=55432 user=postgres dbname=ora_test sslmode=disable"
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime: 1h

public:
  # The origin browsers see; the OAuth callback is <base_url>/auth/callback/<provider>.
  # Production requires https. development: true permits http on localhost/127.0.0.1 only and
  # drops the Secure cookie attributes.
  # Locally the Vite dev server on :5173 is the browser-facing origin and proxies /auth, /api and
  # /healthz here, so cookies and the same-origin check are evaluated against it; an external
  # provider's callback is http://localhost:5173/auth/callback/<provider>.
  base_url: "http://localhost:5173"
  development: true

session:
  # Absolute, non-sliding browser session lifetime. Unset it defaults by login.provider: 12h for
  # huawei-idaas, 30 days otherwise; the hard maximum is 90 days.
  # ttl: 12h
  cleanup_interval: 10m
  retention: 168h      # audit window before expired/revoked rows are deleted
  cleanup_batch: 500

login:
  # External provider of this deployment: huawei-idaas | github. It is the default for
  # POST /auth/login and the only one whose secret is read. Locally `task setup` sets
  # GATEWAY_LOGIN_PROVIDER from config.toml when [github] or [idaas] is filled in; left unset with
  # development_provider, the Gateway offers only the development login.
  # provider: "huawei-idaas"
  attempt_ttl: 10m     # 1m..1h
  rate_limit_per_minute: 30
  rate_limit_burst: 30
  pkce_key_file: ".local/gateway/gateway-pkce.key" # at least 32 random bytes; `task setup`
  # Registers the "dev" provider: a local form where any typed identity (including a
  # huawei-corp uuid) signs in, so the frontend can be developed without an IDaaS application or
  # GitHub OAuth App. Only valid with public.development; production configurations must not
  # set it.
  development_provider: true

cloud:
  upstream: "http://127.0.0.1:8080"
  timeout: 30s

tokens:
  issuer: "ora-internal-issuer"
  audience: "ora-cloud"
  service_subject: "gateway-a"
  service_key_id: "gateway-service-2026"
  service_private_key_file: ".local/gateway/gateway-service.key" # PKCS#8 Ed25519 PEM
  user_key_id: "user-identity-2026"
  user_private_key_file: ".local/gateway/user-identity.key"      # PKCS#8 Ed25519 PEM
  lifetime: 60s        # at most 5m; Cloud rejects longer credentials

web:
  # Built frontend (`npm --prefix frontend run build` output) served on this origin, next to /auth
  # and /api, so no separate web server is needed. Empty serves no frontend (development uses Vite).
  # Override: GATEWAY_WEB_DIST_DIR.
  dist_dir: ""

github:
  # Read only when login.provider is github. Locally `task setup` supplies GATEWAY_GITHUB_CLIENT_ID
  # and writes the secret file from config.toml; the secret file holds only the secret value.
  client_id: ""
  client_secret_file: ".local/gateway/github-client-secret"
  # Override for GitHub Enterprise Server; source then names that host.
  # authorize_url: "https://github.example.com/login/oauth/authorize"
  # token_url: "https://github.example.com/login/oauth/access_token"
  # user_url: "https://github.example.com/api/v3/user"
  # source: "github.example.com"

idaas:
  # Read only when login.provider is huawei-idaas. Test environment: https://uniportal-beta.huawei.com.
  # Locally `task setup` supplies GATEWAY_IDAAS_BASE_URL / GATEWAY_IDAAS_CLIENT_ID and writes the
  # secret file from config.toml; production mounts it read-only, e.g. /run/ora-keys/idaas-client-secret.
  base_url: "https://uniportal.huawei.com"
  client_id: ""
  client_secret_file: ".local/gateway/idaas-client-secret"
  # Optional top-level userinfo field. Missing/empty/non-string values fall back to uuid.
  display_name_field: "userName"
  timeout: 10s
