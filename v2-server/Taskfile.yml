version: '3'
# Included by the root Taskfile as `v2`; paths are relative to this directory.
tasks:
  offline:build:
    desc: Build a relocatable offline Linux package on an online build host
    cmds: [bash scripts/build-offline.sh]
  execution:test:
    desc: Verify public Service with real Node, tool output, PostgreSQL and restart history
    preconditions:
      - sh: test -n "$V2_NODE_ASSETS_DIR" && test -n "$TEST_DATABASE_URL"
        msg: Set V2_NODE_ASSETS_DIR and TEST_DATABASE_URL for real execution evidence
    cmds: [go test -race -count=1 -run TestReal -v ./internal/executionruntime]
  node:history:test:
    desc: Verify a full answer beyond IPC limits survives End and restart in PostgreSQL
    preconditions:
      - sh: test -n "$V2_NODE_ASSETS_DIR" && test -n "$TEST_DATABASE_URL"
        msg: Set V2_NODE_ASSETS_DIR and TEST_DATABASE_URL for real Node/PostgreSQL evidence
    cmds: [go test -race -count=1 -run TestRealAgentLongHistoryPostgresAfterRestart -v ./internal/nodeservices]
  node:agent:test:
    desc: Exercise real Node clone, plugin, Agent tool and cancellation on native Linux
    preconditions:
      - sh: test -n "$V2_NODE_ASSETS_DIR"
        msg: Set V2_NODE_ASSETS_DIR to the prepared assets directory
    cmds: [go test -race -count=1 -run TestReal -v ./internal/nodeservices]
  node:prepare:
    desc: Build pinned Node/reaper and prepare verified OpenCode and Claude Code assets on Linux
    cmds: [bash scripts/prepare-node.sh]
  node:test:
    desc: Test real Node runtime on a native Linux filesystem (requires V2_NODE_TEST_BIN_DIR)
    preconditions:
      - sh: test -n "$V2_NODE_TEST_BIN_DIR"
        msg: Set V2_NODE_TEST_BIN_DIR to the prepared binary directory
    cmds: [go test -race -count=1 -run TestReal -v ./internal/node]
  db:
    desc: Start the repository's compose PostgreSQL (127.0.0.1:55432)
    dir: ..
    cmds: [docker compose -p cloud up -d --wait]
  server:
    desc: Run v2-server on :8090 against the compose PostgreSQL
    deps: [db]
    env: {V2_LOGIN: email}
    cmds: [go run .]
  web:
    desc: Run the frontend-v2 dev server on :5173 (proxies /api and /auth to :8090)
    dir: ../frontend-v2
    cmds: [npm ci, npm run dev]
  dev:
    desc: 'Cloud v2 in one command (PostgreSQL, v2-server, frontend-v2); open http://localhost:5173'
    deps: [db]
    cmds:
      - task: dev:both
  dev:both:
    internal: true
    deps: [server, web]
  deepseek:
    desc: 'Cloud v2 against DeepSeek Flash with the key from ~/ora-demo/.env (see v2-server/.env.example); open http://localhost:5173'
    cmds:
      # Validate the key before starting anything, so a missing key never leaves half the stack running.
      - bash scripts/deepseek.sh --check
      - task: db
      - task: deepseek:both
  deepseek:both:
    internal: true
    deps: [deepseek:server, web]
  deepseek:server:
    internal: true
    cmds: [bash scripts/deepseek.sh]
  demo:newcomer:
    desc: 'Demo scene A (newcomer) from a clean state: database ora_v2_demo_newcomer, ~/.od/a, :8191 / :5191'
    cmds: [{task: demo:run, vars: {SCENE: newcomer}}]
  demo:lead:
    desc: 'Demo scene B (Tech Lead) from a clean state, mock on: ora_v2_demo_lead, ~/.od/b, :8192 / :5192'
    cmds: [{task: demo:run, vars: {SCENE: lead}}]
  demo:ops:
    desc: 'Demo scene C (operations) from a clean state: ora_v2_demo_ops, ~/.od/c, :8193 / :5193'
    cmds: [{task: demo:run, vars: {SCENE: ops}}]
  demo:
    desc: 'All three demo scenes in one environment, one account each, mock on: ora_v2_demo, ~/.od/all, :8190 / :5190'
    cmds: [{task: demo:run, vars: {SCENE: all}}]
  demo:run:
    internal: true
    cmds:
      # Validate the key and Node assets before resetting anything (see scripts/deepseek.sh).
      - bash scripts/deepseek.sh --check
      - task: db
      - bash scripts/demo.sh {{.SCENE}}
  test:
    desc: v2-server tests against the compose PostgreSQL
    deps: [db]
    env:
      TEST_DATABASE_URL: postgres://ora:ora-local@127.0.0.1:55432/ora?sslmode=disable
    cmds: [go test -race -count=1 ./...]
  e2e:
    desc: Playwright end-to-end tests of frontend-v2 against v2-server
    deps: [db]
    dir: ../frontend-v2
    cmds: [npm ci, npm run e2e]
